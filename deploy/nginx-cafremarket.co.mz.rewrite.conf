# Laravel / zCart rewrite rules for aapanel
# File: /www/server/panel/vhost/rewrite/cafremarket.co.mz.conf
#
# Without location / { try_files ... } only the homepage works;
# /api/*, /admin/*, /shop/*, etc. all return nginx 404.

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# Optional: PHP handler is usually already in enable-php-83.conf.
