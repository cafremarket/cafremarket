# Add inside the cafremarket.co.mz server { } block (after SSL, before location ~ \.php)
# Improves TTFB perception for static assets and enables gzip.

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

# Long-cache hashed theme assets; short-cache dynamic-looking paths
location ~* \.(?:css|js|woff2?|ttf|eot|ico|gif|jpe?g|png|webp|svg)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    access_log off;
    try_files $uri =404;
}

# Do not cache HTML / API
location ~* \.(?:html|php)$ {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
}
